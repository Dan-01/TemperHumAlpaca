name: build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/TemperHumAlpaca/TemperHumAlpaca.csproj

      - name: Publish self-contained win-x64
        run: >-
          dotnet publish src/TemperHumAlpaca/TemperHumAlpaca.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/win-x64

      - name: Copy sample configuration
        shell: pwsh
        run: Copy-Item src/TemperHumAlpaca/temperhum.json publish/win-x64/temperhum.json -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TemperHumAlpaca-win-x64
          path: publish/win-x64/
          if-no-files-found: error
