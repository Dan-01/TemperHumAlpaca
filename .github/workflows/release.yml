name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/TemperHumAlpaca/TemperHumAlpaca.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Project <Version> is missing.' }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') { throw "Invalid release version: $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore service
        run: dotnet restore src/TemperHumAlpaca/TemperHumAlpaca.csproj

      - name: Restore N.I.N.A. plugin
        run: dotnet restore src/TemperHumAlpaca.NinaPlugin/TemperHumAlpaca.NinaPlugin.csproj

      - name: Publish self-contained win-x64
        run: >-
          dotnet publish src/TemperHumAlpaca/TemperHumAlpaca.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/win-x64

      - name: Build N.I.N.A. plugin
        run: dotnet build src/TemperHumAlpaca.NinaPlugin/TemperHumAlpaca.NinaPlugin.csproj -c Release --no-restore

      - name: Copy sample configuration
        shell: pwsh
        run: Copy-Item src/TemperHumAlpaca/temperhum.json publish/win-x64/temperhum.json -Force

      - name: Stage and validate N.I.N.A. plugin
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $pluginOutput = Join-Path $PWD 'src/TemperHumAlpaca.NinaPlugin/bin/Release/net8.0-windows7.0'
          $pluginDll = Join-Path $pluginOutput 'TemperHumAlpaca.NinaPlugin.dll'
          if (!(Test-Path $pluginDll)) { throw 'TemperHumAlpaca N.I.N.A. plugin DLL was not produced.' }

          $assembly = [System.Reflection.AssemblyName]::GetAssemblyName($pluginDll)
          $expectedPluginVersion = "$version.0"
          if ($assembly.Version.ToString() -ne $expectedPluginVersion) {
            throw "Unexpected N.I.N.A. plugin assembly version: $($assembly.Version); expected $expectedPluginVersion"
          }

          $combinedStage = Join-Path $PWD 'publish/win-x64/NINA-Plugin'
          New-Item -ItemType Directory -Path $combinedStage -Force | Out-Null
          Copy-Item $pluginDll $combinedStage -Force
          Copy-Item 'docs/NINA_PLUGIN.md' (Join-Path $combinedStage 'README.md') -Force

          $pluginOnlyStage = Join-Path $PWD 'publish/nina-plugin/TemperHumAlpaca'
          New-Item -ItemType Directory -Path $pluginOnlyStage -Force | Out-Null
          Copy-Item $pluginDll $pluginOnlyStage -Force
          Copy-Item 'docs/NINA_PLUGIN.md' (Join-Path $pluginOnlyStage 'README.md') -Force

      - name: Smoke test release binary
        shell: pwsh
        run: |
          $expectedVersion = '${{ steps.version.outputs.version }}'
          $configPath = Join-Path $PWD 'publish/win-x64/temperhum.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($config.deviceProfile -ne 'auto') { throw 'Release configuration must default deviceProfile to auto.' }
          if ($config.forecastEnabled -ne $false) { throw 'Release configuration must default forecastEnabled to false.' }
          if ($config.forecastHours -ne 12) { throw 'Release forecast horizon must default to 12 hours.' }
          $config.autoConnect = $false
          $config | ConvertTo-Json | Set-Content $configPath

          if (!(Test-Path 'publish/win-x64/NINA-Plugin/TemperHumAlpaca.NinaPlugin.dll')) {
            throw 'Combined release package is missing the N.I.N.A. plugin DLL.'
          }

          $exe = Join-Path $PWD 'publish/win-x64/TemperHumAlpaca.exe'
          $probe = (& $exe --probe --vid 413D --pid 2107 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw '--probe returned a non-zero exit code.' }
          if ($probe -notmatch 'HID probe') { throw '--probe output is missing its diagnostic heading.' }
          if ($probe -notmatch 'no TEMPerHUM measurement command is sent') { throw '--probe did not report its read-only safety behaviour.' }

          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden

          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $description = Invoke-RestMethod 'http://127.0.0.1:11111/management/v1/description' -TimeoutSec 2
                $driverVersion = Invoke-RestMethod 'http://127.0.0.1:11111/api/v1/observingconditions/0/driverversion' -TimeoutSec 2
                $dashboard = Invoke-WebRequest 'http://127.0.0.1:11112/dashboard' -UseBasicParsing -TimeoutSec 2
                $status = Invoke-RestMethod 'http://127.0.0.1:11112/api/v1/status' -TimeoutSec 2
                $history = Invoke-RestMethod 'http://127.0.0.1:11112/api/v1/history' -TimeoutSec 2
                $forecast = Invoke-RestMethod 'http://127.0.0.1:11112/api/v1/forecast' -TimeoutSec 2
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }

            if (-not $ready) { throw 'Release binary did not become ready.' }
            if ($description.Value.ManufacturerVersion -ne $expectedVersion) { throw 'Management version does not match project version.' }
            if ($driverVersion.Value -ne $expectedVersion) { throw 'DriverVersion does not match project version.' }
            if ($dashboard.StatusCode -ne 200) { throw 'Dashboard did not return HTTP 200.' }
            if ($dashboard.Content -notmatch 'AstroZap estimate') { throw 'Dashboard is missing AstroZap guidance.' }
            if ($dashboard.Content -notmatch 'Dew margin history') { throw 'Dashboard is missing dew history.' }
            if ($dashboard.Content -notmatch 'Overnight set-and-leave outlook') { throw 'Dashboard is missing overnight forecast outlook.' }
            if ($history.windowMinutes -ne 120) { throw 'History API window was unexpected.' }
            if ($forecast.enabled -ne $false) { throw 'Forecast API should be disabled in the release sample configuration.' }
            if ($status.version -ne $expectedVersion) { throw 'Local status API version does not match project version.' }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Copy-Item src/TemperHumAlpaca/temperhum.json $configPath -Force
          }

      - name: Package release assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $combinedZip = "TemperHumAlpaca-v$version-win-x64.zip"
          $pluginZip = "TemperHumAlpaca-v$version-NINA-plugin.zip"

          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath $combinedZip -Force
          Compress-Archive -Path 'publish/nina-plugin/*' -DestinationPath $pluginZip -Force

          $combinedHash = (Get-FileHash $combinedZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $pluginHash = (Get-FileHash $pluginZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$combinedHash  $combinedZip" | Set-Content "$combinedZip.sha256"
          "$pluginHash  $pluginZip" | Set-Content "$pluginZip.sha256"

      - name: Create tagged GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $combinedZip = "TemperHumAlpaca-v$version-win-x64.zip"
          $pluginZip = "TemperHumAlpaca-v$version-NINA-plugin.zip"

          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; nothing to create."
            exit 0
          }

          gh release create $tag `
            $combinedZip "$combinedZip.sha256" `
            $pluginZip "$pluginZip.sha256" `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title "TemperHumAlpaca $tag" `
            --generate-notes `
            --latest
